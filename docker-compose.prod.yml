services:
  blog:
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - blog
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-v2202511310846397435.powersrv.de}
      OLD_ADDRESS: ${OLD_ADDRESS:-rr7-blog.152-53-135-86.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
